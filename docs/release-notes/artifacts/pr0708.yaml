changes:
  - title: Deployed keepalived directly from the HAProxy charm
    author: tphan025
    type: minor
    description: >
      The HAProxy charm now installs keepalived directly, so a separate
      keepalived deployment is no longer required. The `vip` configuration option
      is restored for active-passive high availability.
