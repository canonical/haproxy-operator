version_schema: 2

changes:
  - title: Added a user-provided Juju secret for hashing client IPs in logs
    author: Ignavar
    type: minor
    description: >
      Client IP hashing now uses a user-provided Juju secret as its salt,
      and the salt is redacted from the get-configuration action output.
      Secret rotation is intentionally unsupported because changing the salt
      changes the hashes and prevents correlation with existing logs.
    urls:
      pr:
        - https://github.com/canonical/haproxy-operator/pull/636
      related_doc:
      related_issue:
    visibility: public
    highlight: false
