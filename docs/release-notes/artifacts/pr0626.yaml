version_schema: 2

changes:
  - title: Removed event deferral and moved TLS/ingress handling into the reconcile loop
    author: tphan025
    type: bugfix
    description: >
      Prevented TCP-only deployments connected to a certificates provider from
      entering a blocked state when no hostname is configured. TLS certificate
      and CA events now reconcile current state without being deferred, and
      ingress URLs are published during reconciliation.
    urls:
      pr:
        - https://github.com/canonical/haproxy-operator/pull/626
      related_doc:
      related_issue: https://github.com/canonical/haproxy-operator/issues/618
    visibility: public
    highlight: false
