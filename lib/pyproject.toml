[project]
name = "haproxy-libs"
version = "0.0.0"
description = "Internal charm libraries shared by the haproxy-operator monorepo charms."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "typing-extensions",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "charms" ]
