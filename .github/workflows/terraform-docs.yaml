name: Update Terraform documentation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  terraform-docs:
    name: Update Terraform documentation
    permissions:
      contents: write
      pull-requests: write
    uses: canonical/operator-workflows/.github/workflows/generate_terraform_docs.yaml@main
    secrets: inherit
    with:
      terraform-directory: terraform/charm,terraform/product
