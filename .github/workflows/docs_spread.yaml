name: Docs spread

on:
  pull_request:
  schedule:
  - cron: 0 9 * * 1 # At 09:00 UTC on Monday, aligned with the weekly haproxy stable release.

jobs:
  doc-test:
    uses: canonical/charm-ci/.github/workflows/doc-test.yml@58ae6614a3b143d4e57eff0fd1770e97d8c30fab # v1.0.1
    permissions:
      contents: read
      actions: read
    with:
      spread-jobs-include: "docs-ci:*"
